name: Offline tests and synthetic benchmark
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check packaged demo model on held-out image
        run: python -m fraudvision.cli inspect data/images/doc_0280.jpg
      - name: Compile source
        run: python -m compileall -q fraudvision
